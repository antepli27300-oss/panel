<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Majör Sipariş Paneli</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --text: #1d1b19; --muted: #6f6a63; --line: #e4ded5;
    --red: #c8102e; --red-soft: #fdecee; --green: #1f8a4c; --amber: #b7791f; --blue: #1c5fa8;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #1f1d1b; --text: #f1ede8; --muted: #a49d94; --line: #33302c;
      --red: #ff4d63; --red-soft: #3a1b20; --green: #3ec27a; --amber: #e0a43a; --blue: #6aa8ee;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---- giriş ---- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .primary { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 8px; background: var(--red); color: #fff; font-weight: 600; }
  .primary:disabled { opacity: .6; cursor: default; }
  .err { color: var(--red); margin-top: 12px; font-size: 14px; }

  /* ---- üst çubuk ---- */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  header h1 { margin: 0; font-size: 19px; flex: 1 1 auto; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--red); }
  .conn { font-size: 14px; color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 12px; }
  .btn.active { border-color: var(--green); color: var(--green); }
  .btn.warn { border-color: var(--red); color: var(--red); }

  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 14px; }
  .stat.new b { color: var(--red); }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .tab.sel { background: var(--text); color: var(--bg); border-color: var(--text); }

  .banner { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .order { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .order.isnew { border: 2px solid var(--red); background: var(--red-soft); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(200,16,46,.18); } }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 700; font-size: 18px; }
  .time { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .order a { color: var(--blue); text-decoration: none; }
  .order a:hover { text-decoration: underline; }
  .items { margin: 4px 0; padding: 8px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
  .items div { padding: 1px 0; }
  .note { background: var(--bg); border-radius: 6px; padding: 6px 8px; font-size: 14px; }
  .total { font-weight: 700; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .st-Yeni { color: var(--red); border-color: var(--red); }
  .st-Hazırlanıyor { color: var(--amber); border-color: var(--amber); }
  .st-Yolda { color: var(--blue); border-color: var(--blue); }
  .st-Teslim { color: var(--green); border-color: var(--green); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .actions button { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
  .actions button.cur { background: var(--text); color: var(--bg); border-color: var(--text); cursor: default; }
  .actions button.go { background: var(--green); color: #fff; border-color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---- ses kilidi ---- */
  #unlock { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 16px; }
  #unlock .box { background: var(--card); border-radius: 14px; padding: 28px; max-width: 420px; text-align: center; }
  #unlock h2 { margin: 0 0 8px; }
  #unlock p { color: var(--muted); margin: 0 0 16px; }
</style>
</head>
<body>

<!-- ============ FIREBASE AYARLARI: BURAYI KENDİ BİLGİLERİNLE DOLDUR ============ -->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "AIzaSyB_2SSGQeeeFvu_CViecPNwF26objlbFfo",
    authDomain: "major-767c4.firebaseapp.com",
    projectId: "major-767c4",
    storageBucket: "major-767c4.firebasestorage.app",
    messagingSenderId: "11640897192",
    appId: "1:11640897192:web:71a28a1b78a39d7fa0cc9d"
  };
</script>
<!-- ============================================================================ -->

<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>🍕 Pizza Majör</h1>
    <p>Sipariş paneli – yönetici girişi</p>
    <label for="email">E-posta</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Şifre</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="loginBtn" type="submit">Giriş yap</button>
    <div class="err hidden" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <h1>🍕 Pizza Majör – Siparişler</h1>
    <span class="conn"><span class="dot" id="dot"></span><span id="connText">Bağlanıyor…</span></span>
    <button class="btn" id="soundBtn" type="button">🔊 Ses açık</button>
    <button class="btn" id="testBtn" type="button">Sesi dene</button>
    <button class="btn" id="logoutBtn" type="button">Çıkış</button>
  </header>
  <main>
    <div class="banner hidden" id="banner"></div>
    <div class="stats">
      <div class="stat new"><b id="sNew">0</b><span>Yeni sipariş</span></div>
      <div class="stat"><b id="sPrep">0</b><span>Hazırlanıyor</span></div>
      <div class="stat"><b id="sWay">0</b><span>Yolda</span></div>
      <div class="stat"><b id="sToday">0</b><span>Bugün sipariş</span></div>
      <div class="stat"><b id="sRev">0 ₺</b><span>Bugün ciro (iptal hariç)</span></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab sel" data-tab="active" type="button">Aktif</button>
      <button class="tab" data-tab="done" type="button">Tamamlanan</button>
      <button class="tab" data-tab="all" type="button">Hepsi</button>
    </div>
    <div class="grid" id="list"></div>
  </main>
</section>

<div id="unlock" class="hidden">
  <div class="box">
    <h2>Paneli başlat</h2>
    <p>Yeni sipariş geldiğinde sesli uyarı verebilmesi için bir kez tıkla.</p>
    <button class="primary" id="unlockBtn" type="button">🔊 Sesi aç ve başla</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const STATUSES = ["Yeni", "Hazırlanıyor", "Yolda", "Teslim Edildi", "İptal"];
const ACTIVE = ["Yeni", "Hazırlanıyor", "Yolda"];
const NEXT = { "Yeni": "Hazırlanıyor", "Hazırlanıyor": "Yolda", "Yolda": "Teslim Edildi" };
const REMIND_MS = 30000;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tl = (n) => `${Number(n) || 0} ₺`;

// ---------- ayar kontrolü ----------
const cfg = window.FIREBASE_CONFIG;
const configured = cfg && cfg.apiKey && !String(cfg.apiKey).startsWith("BURAYA");

// ---------- durum ----------
let orders = [];
let knownIds = null;          // ilk veri gelene kadar null
let tab = "active";
let soundOn = true;
let audioReady = false;
let audioCtx = null;
let unsub = null;
let remindTimer = null;

// ---------- ses ----------
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* ses desteklenmiyor */ }
  audioReady = true;
}

function beep() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [[880, 0], [1175, 0.22], [880, 0.44]].forEach(([f, d]) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + d); o.stop(t + d + 0.22);
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR";
    const v = window.speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith("tr"));
    if (v) u.voice = v;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  } catch (e) { /* sessiz geç */ }
}

function alertNew(count) {
  if (!soundOn || !audioReady) return;
  beep();
  setTimeout(() => speak(count > 1 ? `${count} yeni siparişiniz var` : "Yeni siparişiniz var"), 700);
}

// ---------- görünüm ----------
function ago(ts) {
  if (!ts) return "";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "az önce";
  if (m < 60) return `${m} dk önce`;
  const h = Math.floor(m / 60);
  return `${h} sa ${m % 60} dk önce`;
}
const clock = (ts) => ts ? new Date(ts).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }) : "";
const stClass = (s) => "st-" + String(s).split(" ")[0];

function renderStats() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const today = orders.filter((o) => o.createdAt >= start.getTime());
  $("sNew").textContent = orders.filter((o) => o.status === "Yeni").length;
  $("sPrep").textContent = orders.filter((o) => o.status === "Hazırlanıyor").length;
  $("sWay").textContent = orders.filter((o) => o.status === "Yolda").length;
  $("sToday").textContent = today.length;
  $("sRev").textContent = tl(today.filter((o) => o.status !== "İptal").reduce((a, o) => a + (Number(o.total) || 0), 0));
  const n = orders.filter((o) => o.status === "Yeni").length;
  document.title = (n > 0 ? `(${n}) Yeni sipariş – ` : "") + "Pizza Majör Sipariş Paneli";
}

function renderList() {
  const shown = orders.filter((o) =>
    tab === "all" ? true : tab === "active" ? ACTIVE.includes(o.status) : !ACTIVE.includes(o.status));
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty" style="grid-column:1/-1">${tab === "active" ? "Şu an aktif sipariş yok." : "Sipariş yok."}</div>`;
    return;
  }
  $("list").innerHTML = shown.map((o) => {
    const next = NEXT[o.status];
    const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(o.address || "");
    const tel = String(o.phone || "").replace(/[^\d+]/g, "");
    const btns = STATUSES.map((s) =>
      `<button type="button" data-id="${esc(o.id)}" data-status="${esc(s)}" class="${s === o.status ? "cur" : (s === next ? "go" : "")}">${esc(s)}</button>`
    ).join("");
    return `
      <article class="order ${o.status === "Yeni" ? "isnew" : ""}">
        <div class="row"><span class="name">${esc(o.customerName)}</span><span class="time">${esc(clock(o.createdAt))} · ${esc(ago(o.createdAt))}</span></div>
        <div class="row"><span class="badge ${stClass(o.status)}">${esc(o.status)}</span><span class="total">${esc(tl(o.total))}</span></div>
        <div>📞 <a href="tel:${esc(tel)}">${esc(o.phone)}</a></div>
        <div>📍 <a href="${esc(maps)}" target="_blank" rel="noopener">${esc(o.address)}</a></div>
        ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ""}
        <div class="items">${(o.items || []).map((i) => `<div>${esc(i)}</div>`).join("")}</div>
        <div class="actions">${btns}</div>
      </article>`;
  }).join("");
}

function render() { renderStats(); renderList(); }

function setConn(ok, text) {
  $("dot").className = "dot " + (ok ? "on" : "off");
  $("connText").textContent = text;
}

function showBanner(msg) {
  $("banner").textContent = msg || "";
  $("banner").classList.toggle("hidden", !msg);
}

// ---------- olaylar ----------
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("sel", t === b));
  renderList();
});

$("soundBtn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn ? "🔊 Ses açık" : "🔇 Ses kapalı";
  $("soundBtn").classList.toggle("warn", !soundOn);
  if (!soundOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
});

$("testBtn").addEventListener("click", () => { unlockAudio(); const prev = soundOn; soundOn = true; alertNew(1); soundOn = prev; });

$("unlockBtn").addEventListener("click", () => {
  unlockAudio();
  $("unlock").classList.add("hidden");
  const prev = soundOn; soundOn = true; alertNew(1); soundOn = prev;
});

setInterval(() => { if (orders.length) renderList(); }, 30000);   // "x dk önce" yazılarını tazele

// ---------- Firebase ----------
if (!configured) {
  $("login").classList.remove("hidden");
  $("loginForm").innerHTML = `<h1>Ayar eksik</h1><p>index.html dosyasının başındaki <b>FIREBASE_CONFIG</b> bölümünü Firebase'den aldığın bilgilerle doldurman gerekiyor.</p>`;
} else {
  const app = initializeApp(cfg);
  const auth = getAuth(app);
  const db = getFirestore(app);

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    unlockAudio();                                   // tıklama = ses izni
    $("loginErr").classList.add("hidden");
    $("loginBtn").disabled = true;
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    } catch (err) {
      const code = (err && err.code) || "";
      $("loginErr").textContent =
        code.includes("network") ? "İnternet bağlantısı yok." :
        code.includes("unauthorized-domain") ? "Bu adres Firebase'de yetkilendirilmemiş (Authorized domains)." :
        "Giriş başarısız. E-posta veya şifre hatalı.";
      $("loginErr").classList.remove("hidden");
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", () => signOut(auth));

  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-status]");
    if (!b || b.classList.contains("cur")) return;
    const status = b.dataset.status;
    if (status === "İptal" && !confirm("Bu siparişi iptal etmek istediğine emin misin?")) return;
    b.disabled = true;
    try {
      await updateDoc(doc(db, "orders", b.dataset.id), { status });
      showBanner("");
    } catch (err) {
      b.disabled = false;
      const code = (err && err.code) ? err.code : "bilinmeyen";
      showBanner(code === "permission-denied"
        ? "Durum güncellenemedi: izin yok (permission-denied). Çıkış yapıp yeniden giriş yapmayı dene."
        : code === "not-found"
        ? "Durum güncellenemedi: bu sipariş artık veritabanında yok (silinmiş olabilir). Sayfayı yenile."
        : "Durum güncellenemedi (" + code + "). İnternetini kontrol edip tekrar dene.");
      console.error("updateDoc hatası:", err);
    }
  });

  function start() {
    knownIds = null;
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    unsub = onSnapshot(q, (snap) => {
      const list = snap.docs.map((d) => ({ ...d.data() ,id: d.id }));
      const fresh = knownIds ? list.filter((o) => !knownIds.has(o.id) && o.status === "Yeni") : [];
      knownIds = new Set(list.map((o) => o.id));
      orders = list;
      setConn(true, "Canlı");
      showBanner("");
      render();
      if (fresh.length) alertNew(fresh.length);
    }, (err) => {
      setConn(false, "Bağlantı sorunu");
      showBanner(err && err.code === "permission-denied"
        ? "Siparişleri okuma izni yok. Firestore kurallarını ve yönetici hesabını kontrol et."
        : "Siparişler yüklenemedi: " + ((err && err.message) || "bilinmeyen hata"));
    });
    // Cevaplanmayan yeni sipariş varken tekrar tekrar uyar
    remindTimer = setInterval(() => {
      const n = orders.filter((o) => o.status === "Yeni").length;
      if (n > 0) alertNew(n);
    }, REMIND_MS);
  }

  function stop() {
    if (unsub) { unsub(); unsub = null; }
    if (remindTimer) { clearInterval(remindTimer); remindTimer = null; }
    orders = []; knownIds = null;
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      if (!audioReady) $("unlock").classList.remove("hidden");
      setConn(false, "Bağlanıyor…");
      start();
    } else {
      stop();
      $("app").classList.add("hidden");
      $("unlock").classList.add("hidden");
      $("login").classList.remove("hidden");
      document.title = "Pizza Majör Sipariş Paneli";
    }
  });
}
</script>
</body>
</html>
